
<!DOCTYPE html>
<html>
<head>
    <title>List a Book</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>List Your Book</h1>
        <p>Share your old books with other students</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="books.html">Browse Books</a>
        <a href="list-book.html">List a Book</a>
    </nav>

    <main>
        <h2 id="formHeading">Enter Book Details</h2>

        <form id="listingForm">
            <label for="studentName">Student Name:</label>
            <input type="text" id="studentName">

            <label for="newBookTitle">Book Title:</label>
            <input type="text" id="newBookTitle">

            <label for="authorName">Author:</label>
            <input type="text" id="authorName">

            <label for="bookCategory">Subject or Category:</label>
            <input type="text" id="bookCategory">

            <label for="bookCondition">Book Condition:</label>
            <select id="bookCondition">
                <option value="">Select Condition</option>
                <option value="Like New">Like New</option>
                <option value="Good">Good</option>
                <option value="Used">Used</option>
            </select>

            <button type="submit">Submit Book</button>
        </form>

        <p id="formMessage"></p>

        <button onclick="changeFormHeading()">Change Heading Size</button>
        <button onclick="toggleForm()">Show or Hide Form</button>
    </main>

    <footer>
        <p>Campus Book Exchange - Student Project</p>
    </footer>

</body>
</html>
